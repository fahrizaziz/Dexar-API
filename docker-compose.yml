version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wfh_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: wfh_attendance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wfh_network

  redis:
    image: redis:7-alpine
    container_name: wfh_redis_cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - wfh_network

networks:
  wfh_network:
    driver: bridge

volumes:
  postgres_data:
